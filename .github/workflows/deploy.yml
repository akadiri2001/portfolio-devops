name: Build & Deploy to ECS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screen/**'
      - 'LICENSE'
  workflow_dispatch:

# Évite deux déploiements simultanés sur la même branche.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: portfolio
  ECS_CLUSTER: portfolio-cluster
  ECS_SERVICE: portfolio-service
  SOURCE_REPO: akadiri2001/portefolio

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Ce dépôt : Dockerfile, nginx.conf, infra/
      - name: Checkout infra repo
        uses: actions/checkout@v4

      # 2. Le dépôt privé du portfolio : package.json, src/
      #    Nécessite le secret PORTFOLIO_REPO_TOKEN (PAT en lecture seule).
      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PORTFOLIO_REPO_TOKEN }}
          path: app

      # 3. On réunit les deux dans un seul contexte de build.
      - name: Assemble build context
        run: |
          set -euo pipefail
          cp Dockerfile nginx.conf .dockerignore app/
          echo "Contenu du contexte de build :"
          ls -A app/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Le tag :latest est indispensable : la task definition Terraform
      # pointe sur portfolio:latest, pas sur le SHA du commit.
      - name: Build, tag & push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" app/
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to ECS
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query 'service.serviceName' --output text

      # Sans cette étape, le job passe au vert même si ECS rollback.
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "Service stable."
